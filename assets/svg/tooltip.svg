    <text x="34" y="134" fill="#eab308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="800">48%</text>
    <text x="232" y="134" fill="#d4d4d8" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600">3d 14h <tspan fill="#a1a1aa">(11.08, 12:30)</tspan></text>
    <rect x="34" y="143" width="200" height="5" rx="2.5" fill="#27272a"/>
    <rect x="34" y="143" width="96" height="5" rx="2.5" fill="#eab308"/>
