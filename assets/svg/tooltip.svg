  <text x="260" y="192" fill="#a1a1aa" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600"><tspan fill="#ffffff" font-weight="700">Google AI Pro</tspan> · <tspan fill="#3b82f6">Dashboard</tspan> · <tspan fill="#3b82f6">Models</tspan> · <tspan fill="#3b82f6">Settings</tspan></text>
