name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release_meta.outputs.should_release }}
      version: ${{ steps.release_meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read release metadata
        id: release_meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          subject="$(git log -1 --pretty=%s)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version is not a valid SemVer value: $version" >&2
            exit 1
          fi

          if [[ "$subject" != "$version" ]]; then
            echo "Skipping release because the latest commit subject is '$subject', not '$version'."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null
          ls_remote_status=$?
          set -e

          if [[ $ls_remote_status -eq 0 ]]; then
            echo "Skipping release because tag '$version' already exists."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ $ls_remote_status -ne 2 ]]; then
            echo "Failed to check remote tags for '$version' (exit code $ls_remote_status)." >&2
            exit "$ls_remote_status"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Package and release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.version }}
      VSIX_NAME: ag-usage-${{ needs.check.outputs.version }}.vsix

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Package extension
        run: npx --yes @vscode/vsce@4.1.1 package --no-dependencies --out "$VSIX_NAME"

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.4.0 publish --trusted-publishing --skip-duplicate "$VSIX_NAME"

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --skip-duplicate --packagePath "$VSIX_NAME"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%b > "$RUNNER_TEMP/release-notes.md"

          if [[ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/release-notes.md")" ]]; then
            echo "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          fi

          gh release create "$TAG" "$VSIX_NAME" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
