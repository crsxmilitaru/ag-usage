name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release metadata
        id: release_meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          subject="$(git log -1 --pretty=%s)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version is not a valid SemVer value: $version" >&2
            exit 1
          fi

          if [[ "$subject" != "$version" ]]; then
            echo "Skipping release because the latest commit subject is '$subject', not '$version'."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Skipping release because tag '$version' already exists."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "vsix_name=ag-usage-$version.vsix" >> "$GITHUB_OUTPUT"

          git log -1 --pretty=%b > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "$version" > release-notes.md
          fi

      - name: Setup Node
        if: steps.release_meta.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.release_meta.outputs.should_release == 'true'
        run: npm ci

      - name: Package extension
        if: steps.release_meta.outputs.should_release == 'true'
        run: npx --yes @vscode/vsce package --out "${{ steps.release_meta.outputs.vsix_name }}"

      - name: Create GitHub release
        if: steps.release_meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          VSIX_NAME: ${{ steps.release_meta.outputs.vsix_name }}
        run: |
          gh release create "$TAG" "$VSIX_NAME" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md
